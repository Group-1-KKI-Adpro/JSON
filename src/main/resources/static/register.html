<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>JSON Jastip • Register</title>
    <link rel="stylesheet" href="/css/site.css" />
    <script defer src="/js/site.js"></script>
</head>
<body data-page="register">
<header class="topbar">
    <a class="brand" href="/index.html">
        <span class="brand-mark">J</span>
        <span>JSON Jastip</span>
    </a>
    <nav class="nav-links">
        <a href="/index.html">Home</a>
        <a href="/login.html">Login</a>
        <a href="/register.html">Register</a>
    </nav>
    <div id="accountWidget" class="account-widget"></div>
</header>

<main class="auth-layout">
    <section class="auth-aside">
        <div class="auth-copy">
            <div class="kicker">Register your account</div>
            <h1>Create a profile in a few seconds.</h1>
            <p>After registration, you can log in, update your profile, shop from the catalog, and track everything in one place.</p>
        </div>
    </section>
    <section class="auth-panel-wrap">
        <div class="auth-card">
            <h2>Register</h2>
            <p class="auth-note">Choose a full name, email, and password.</p>
            <div id="authNotice" class="hidden"></div>
            <form id="registerForm" class="form">
                <div class="field">
                    <label for="registerFullName">Full name</label>
                    <input id="registerFullName" type="text" placeholder="Full name" />
                </div>
                <div class="field">
                    <label for="registerEmail">Email</label>
                    <input id="registerEmail" type="email" placeholder="you@example.com" required />
                </div>
                <div class="field">
                    <label for="registerPassword">Password</label>
                    <input id="registerPassword" type="password" minlength="6" placeholder="At least 6 characters" required />
                </div>
                <button class="button" type="submit">Create account</button>
            </form>
            <p class="auth-switch">Already have an account? <a href="/login.html">Log in</a></p>
        </div>
    </section>
</main>
</body>
</html>
