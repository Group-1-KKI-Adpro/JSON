<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>JSON Jastip • Orders</title>
  <link rel="stylesheet" href="/css/site.css" />
  <script defer src="/js/site.js"></script>
</head>
<body data-page="orders">
<header class="topbar">
  <a class="brand" href="/">
    <span class="brand-mark">J</span>
    <span>JSON Jastip</span>
  </a>
  <nav class="nav-links">
    <a href="/">Home</a>
    <a href="/catalog">Catalog</a>
    <a href="/orders">Orders</a>
    <a href="/vouchers">Vouchers</a>
    <a href="/wallet">Wallet</a>
    <a href="/transactions">Transactions</a>
    <a href="/profile">Profile</a>
  </nav>
  <div id="accountWidget" class="account-widget"></div>
</header>

<main class="shell">
  <section class="section">
    <div class="section-header">
      <div>
        <h1 class="section-title">Orders</h1>
        <p class="section-subtitle">Review your cart, place an order, and follow your order history.</p>
      </div>
      <div class="inline-actions">
        <a class="btn-ghost" href="/catalog" style="text-decoration:none;">Back to catalog</a>
        <a class="button" href="/wallet" style="text-decoration:none;">Open wallet</a>
      </div>
    </div>
    <div id="orderNotice" class="hidden"></div>
    <div id="orderSummary" class="grid cols-2" style="margin-top:16px;"></div>
  </section>

  <section class="section grid cols-2" style="align-items:start;">
    <div class="panel">
      <h2 class="section-title" style="margin-top:0; font-size:1.5rem;">Checkout cart</h2>
      <div id="orderCart"></div>
      <form id="orderForm" class="form" style="margin-top:18px;">
        <div class="field">
          <label for="shippingAddress">Shipping address</label>
          <textarea id="shippingAddress" placeholder="Street, city, province, postal code" required></textarea>
        </div>
        <div class="field">
          <label for="voucherCode">Voucher code (optional)</label>
          <input id="voucherCode" type="text" placeholder="PROMO2026" />
        </div>
        <button id="placeOrderButton" class="button" type="submit">Place order</button>
      </form>
    </div>
    <div class="panel">
      <h2 class="section-title" style="margin-top:0; font-size:1.5rem;">Order history</h2>
      <div id="orderHistory" class="grid" style="gap:16px;"></div>
    </div>
  </section>
</main>
</body>
</html>
