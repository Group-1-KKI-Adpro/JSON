<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>JSON Jastip • Vouchers</title>
  <link rel="stylesheet" href="/css/site.css" />
  <script defer src="/js/site.js"></script>
</head>
<body data-page="vouchers">
<header class="topbar">
  <a class="brand" href="/">
    <span class="brand-mark">J</span>
    <span>JSON Jastip</span>
  </a>
  <nav class="nav-links">
    <a href="/">Home</a>
    <a href="/catalog">Catalog</a>
    <a href="/orders">Orders</a>
    <a href="/vouchers">Vouchers</a>
    <a href="/wallet">Wallet</a>
    <a href="/transactions">Transactions</a>
    <a href="/profile">Profile</a>
  </nav>
  <div id="accountWidget" class="account-widget"></div>
</header>

<main class="shell">
  <section class="section">
    <div class="section-header">
      <div>
        <h1 class="section-title">Vouchers</h1>
      </div>
      <div class="inline-actions">
        <a class="btn-ghost" href="/orders" style="text-decoration:none;">Orders</a>
        <a class="button" href="/wallet" style="text-decoration:none;">Wallet</a>
      </div>
    </div>
    <div id="voucherNotice" class="hidden"></div>
  </section>

  <section class="section grid cols-2" style="align-items:start;">
    <div class="panel">
      <h2 class="section-title" style="margin-top:0; font-size:1.5rem;">Active vouchers</h2>
      <div id="voucherList" class="grid" style="gap:16px;"></div>
    </div>
    <div class="panel">
      <h2 class="section-title" style="margin-top:0; font-size:1.5rem;">Validate voucher</h2>
      <form id="voucherValidateForm" class="form">
        <div class="field">
          <label for="validateCode">Code</label>
          <input id="validateCode" type="text" placeholder="PROMO2026" required />
        </div>
        <div class="field">
          <label for="validateTotal">Order total</label>
          <input id="validateTotal" type="number" min="0" placeholder="500000" required />
        </div>
        <button class="button" type="submit">Validate</button>
      </form>
      <div id="voucherValidateResult" class="kpi-list" style="margin-top:18px;"></div>

      <div id="adminVoucherSection" class="hidden" style="margin-top:28px;">
        <div class="section-header">
          <div>
            <h2 class="section-title" style="margin:0; font-size:1.5rem;">Create a new voucher</h2>
          </div>
        </div>
        
        <form id="voucherCreateForm" class="form">
          <div class="input-grid">
            <div class="field">
              <label for="createCode">Code</label>
              <input id="createCode" type="text" placeholder="PROMO2026" required />
            </div>
            <div class="field">
              <label for="createQuota">Quota</label>
              <input id="createQuota" type="number" min="1" placeholder="10" required />
            </div>
            <div class="field">
              <label for="createStartAt">Start at</label>
              <input id="createStartAt" type="datetime-local" required />
            </div>
            <div class="field">
              <label for="createEndAt">End at</label>
              <input id="createEndAt" type="datetime-local" required />
            </div>
          </div>
          <div class="field">
            <label for="createDiscountType">Discount type</label>
            <select id="createDiscountType" required>
              <option value="FLAT">FLAT</option>
              <option value="PERCENTAGE">PERCENTAGE</option>
            </select>
          </div>
          <div class="field">
            <label for="createDiscountValue">Discount value</label>
            <input id="createDiscountValue" type="number" min="1" step="0.01" placeholder="10 or 50000" required />
          </div>
          <div class="field">
            <label for="createTerms">Terms</label>
            <textarea id="createTerms" placeholder="Voucher terms and conditions"></textarea>
          </div>
          <button class="button" type="submit">Create voucher</button>
        </form>
      </div>
    </div>
  </section>
</main>
</body>
</html>
