<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>JSON Jastip • Catalog</title>
  <link rel="stylesheet" href="/css/site.css" />
  <script defer src="/js/site.js"></script>
</head>
<body data-page="catalog">
<header class="topbar">
  <a class="brand" href="/">
    <span class="brand-mark">J</span>
    <span>JSON Jastip</span>
  </a>
  <nav class="nav-links">
    <a href="/">Home</a>
    <a href="/catalog">Catalog</a>
    <a href="/orders">Orders</a>
    <a href="/vouchers">Vouchers</a>
    <a href="/wallet">Wallet</a>
    <a href="/transactions">Transactions</a>
    <a href="/profile">Profile</a>
  </nav>
  <div id="accountWidget" class="account-widget"></div>
</header>

<main class="shell">
  <section class="section">
    <div class="section-header">
      <div>
        <h1 class="section-title">Catalog</h1>
        <p class="section-subtitle">Search and browse items from the backend catalog. Add new items from a separate page.</p>
      </div>
      <div class="controls-row">
        <input id="catalogSearch" class="searchbar" type="search" placeholder="Search by name, origin, description, or jastiper..." />
        <a class="button" href="/catalog/new" style="text-decoration:none;">Add item</a>
      </div>
    </div>
    <div id="catalogNotice" class="hidden"></div>
    <div id="catalogStats" class="grid cols-4"></div>
  </section>

  <section class="section">
    <div id="catalogEmpty" class="hidden"></div>
    <div id="catalogGrid" class="grid cols-2"></div>
  </section>
</main>

<footer class="footer">Use the search bar to filter items in real time.</footer>
</body>
</html>
